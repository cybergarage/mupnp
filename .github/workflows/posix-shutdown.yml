name: POSIX shutdown fixtures
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shutdown:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Offline native POSIX lifecycle characterization (ASan and UBSan)
        run: test/unix/thread-shutdown.sh
